[project]
name = "evilflowers-text-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: PDF tables and the paragraph index (IP-018), embedded through tei-embed"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared runtime (#16): job protocol, catalog client, contract, delivery cap, shutdown, telemetry.
    "evilflowers-worker",
    "numpy>=2",
    "pdfplumber>=0.11",
    "pillow>=11",
    "pymupdf>=1.26",
    "requests>=2.32",
]

[project.optional-dependencies]
# OTLP/HTTP to the node's Alloy, and the Pyroscope SDK; both come with the kit.
otel = ["evilflowers-worker[otel]"]
profiling = ["evilflowers-worker[profiling]"]

[tool.uv.sources]
# Pinned to a commit of master; bump it deliberately.
evilflowers-worker = { git = "https://github.com/EvilFlowersCatalog/evilflowers-worker", rev = "c37d860513662adcb85794adabea39af456ffee8" }

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
    "watchdog[watchmedo]>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]
# Typographic quotes in the sentence-splitting patterns are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_text", "evilflowers_worker"]
